<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="rDo0pulwm2mZnJdZ_EX8KE666mgrz1WYdJ9YBgXxQcc" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amjad Tech Toolkit - AP Raza Style</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Poppins,sans-serif}</style>
</head>
<body class="bg-[#f8fafc]">
<header class="bg-white border-b sticky top-0 z-50 p-4 flex justify-between items-center"><div class="flex gap-2 items-center"><div class="w-9 h-9 bg-black text-white rounded-lg flex items-center justify-center font-black">A</div><b>AMJAD TOOLKIT</b></div><span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-bold">LIVE</span></header>
<div class="max-w-5xl mx-auto p-4">
<div class="bg-black text-white rounded-2xl p-6 text-center mt-4"><h1 class="text-3xl font-black">AP RAZA STYLE <span class="text-yellow-400">TOOLKIT</span></h1><p class="text-gray-400 text-sm mt-2">Fast - Free - No Watermark - All in One</p></div>

<div class="grid md:grid-cols-2 gap-4 mt-6">
<!-- COMPRESSOR -->
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h3 class="font-bold">📦 Image Compressor</h3><input type="file" id="cIn" accept="image/*" class="mt-3 text-xs w-full"><button onclick="compress()" class="mt-3 w-full bg-black text-white py-3 rounded-xl font-bold text-sm">COMPRESS</button><a id="cDown" class="hidden mt-3 block text-center bg-green-500 text-white py-2 rounded-xl text-sm">Download</a><p id="cInfo" class="text-xs text-center mt-2 text-gray-500"></p><canvas id="cCan" class="hidden"></canvas></div>

<!-- QR -->
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h3 class="font-bold">🔗 QR Generator</h3><input id="qrText" placeholder="Link likho" class="mt-3 w-full border p-3 rounded-xl text-sm"><button onclick="makeQR()" class="mt-3 w-full bg-black text-white py-3 rounded-xl font-bold text-sm">GENERATE QR</button><div id="qrcode" class="flex justify-center mt-4"></div></div>

<!-- PASS -->
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h3 class="font-bold">🔑 Password Generator</h3><div id="passOut" class="bg-gray-100 p-3 rounded-xl mt-3 font-mono text-sm font-bold">Click Generate</div><input type="range" id="pLen" min="6" max="30" value="12" class="w-full mt-3"><button onclick="genPass()" class="mt-3 w-full bg-black text-white py-3 rounded-xl font-bold text-sm">GENERATE</button></div>

<!-- TTS -->
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h3 class="font-bold">🔊 Text to Speech</h3><textarea id="tts" placeholder="Bolne ke liye likho..." class="mt-3 w-full border p-3 rounded-xl text-sm h-24"></textarea><div class="flex gap-2 mt-3"><button onclick="speak()" class="flex-1 bg-black text-white py-3 rounded-xl text-sm font-bold">PLAY</button><button onclick="speechSynthesis.cancel()" class="flex-1 bg-gray-200 py-3 rounded-xl text-sm font-bold">STOP</button></div></div>
</div>

<div class="bg-white p-5 rounded-2xl border shadow-sm mt-4 text-center"><h3 class="font-bold">🖼️ Image to PDF</h3><input type="file" id="pdfImgs" multiple accept="image/*" class="mt-3 text-xs"><br><button onclick="makePDF()" class="mt-4 bg-yellow-400 text-black px-6 py-3 rounded-xl font-bold text-sm">CONVERT TO PDF</button></div>
</div>
<script>
function compress(){const f=document.getElementById('cIn').files[0];if(!f)return alert('Image select karo');const img=new Image();img.src=URL.createObjectURL(f);img.onload=()=>{const can=document.getElementById('cCan');can.width=img.width*0.7;can.height=img.height*0.7;can.getContext('2d').drawImage(img,0,0,can.width,can.height);can.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.getElementById('cDown');a.href=u;a.download='compressed.jpg';a.classList.remove('hidden');document.getElementById('cInfo').innerText=`${(f.size/1024).toFixed(0)}KB -> ${(b.size/1024).toFixed(0)}KB`;},'image/jpeg',0.6);}}
function makeQR(){document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:document.getElementById('qrText').value||'Amjad',width:150,height:150});}
function genPass(){const l=document.getElementById('pLen').value;const ch="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$";let p="";for(let i=0;i<l;i++)p+=ch[Math.floor(Math.random()*ch.length)];document.getElementById('passOut').innerText=p;}
function speak(){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('tts').value));}
function makePDF(){const fs=document.getElementById('pdfImgs').files;if(!fs.length)return alert('Image select karo');let w=window.open('');for(let f of fs){let u=URL.createObjectURL(f);w.document.write(`<img src="${u}" style="width:100%;page-break-after:always">`);}w.document.close();setTimeout(()=>w.print(),1000);}
</script>
</body>
</html>
